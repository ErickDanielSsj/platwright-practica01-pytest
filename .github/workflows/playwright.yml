name: Playwright Automatizacion Pipeline


# cuando se va a ejecutar es el disparador


on:
    push:
     branches: [main, master]
    pull_request:
     branches: [ main, master]

jobs:
    test:
        #Sistema operativo donde correran las pruebas
     runs-on: ubuntu-latest

     steps:
        # paso A) clonar el codigo del repositorio
        - name: Copiar codigo del repositorio
          uses: actions/checkout@v4
        #Paso B: Configurar la version de python
        - name: Configurar Python 3.11
          uses: actions/setup-python@v4
          with:
            python-version: "3.11"
        # Paso C: Instalar dependencias
        - name: Instalar dependencias
          # working-directory: playwright_practica_sincrono/practica01
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        # Paso D: Instalar los navegadoires de playwright
        - name: Instalar navegadores de Playwright
          run: playwright install chromium --with-deps
        #Paso E: Ejecutar las pruebas con Pytest y generar reporte XML
        - name: Ejecutar pruebas de playwright
          working-directory: playwright_practica_sincrono/practica01
          run: pytest --junitxml=results.xml
        #Paso F: Guardas las evidencias/ cpaturas de pantalla en Github si algo falla
        - name: Guardas evidencias de ejecucion
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: playwright-results
            path: |
             playwright_practica_sincrono/practica01/results.xml
             playwright_practica_sincrono/practica01/*.png
